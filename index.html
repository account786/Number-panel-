<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Professional Access Panel</title>
    <style>
        :root {
            --bg-color: #080a0f;
            --card-bg: rgba(23, 33, 43, 0.9);
            --tg-blue: #0088cc;
            --mk-color: #00e676;
            --stex-color: #ff5722;
            --voltx-color: #bb86fc;
            --text-main: #ffffff;
            --notice-red: #ff3b30;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 80px; /* নিচের নোটিশের জন্য জায়গা */
        }

        /* টেলিগ্রাম নোটিশ বোর্ড (ডাইনামিক) */
        #notice-board {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 214, 0, 0.15);
            border: 1px solid #ffd600;
            color: #ffd600;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .container { width: 100%; max-width: 420px; display: grid; gap: 12px; }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-header {
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        /* কপি বক্স */
        .copy-box {
            background: #121922;
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .copy-box:active { background: #1c2533; transform: scale(0.98); }

        .copy-box span {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #e0e0e0;
            user-select: none; /* কীবোর্ড বাধা দিতে */
        }

        .copy-label {
            color: var(--tg-blue);
            font-weight: 800;
            font-size: 11px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }

        .btn-launch {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .bg-mk { background: linear-gradient(90deg, #1b5e20, #00e676); }
        .bg-stex { background: linear-gradient(90deg, #bf360c, #ff5722); }
        .bg-voltx { background: linear-gradient(90deg, #4a148c, #bb86fc); }

        /* স্থায়ী লাল নোটিশ (নিচে) */
        .footer-notice {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--notice-red);
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 -5px 15px rgba(255, 59, 48, 0.3);
            z-index: 100;
            border-radius: 15px 15px 0 0;
        }

        /* টোস্ট মেসেজ */
        #toast {
            visibility: hidden;
            background: #ffffff;
            color: #000;
            padding: 10px 25px;
            border-radius: 50px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        #toast.show { visibility: visible; animation: fadeInOut 1.5s ease-in-out; }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -20%); }
            20% { opacity: 1; transform: translate(-50%, -50%); }
            80% { opacity: 1; transform: translate(-50%, -50%); }
            100% { opacity: 0; transform: translate(-50%, -80%); }
        }

        /* কপি সাকসেস ইফেক্ট */
        .copy-success {
            border-color: #00e676 !important;
            background: rgba(0, 230, 118, 0.1) !important;
        }

    </style>
</head>
<body>

    <!-- স্থায়ী লাল নোটিশ -->
    <div class="footer-notice">
        জিমেইল এবং পাসওয়ার্ড কপি করে কাঙ্খিত ওয়েবসাইটে লগইন করে কাজ করুন
    </div>

    <div id="toast">Copied! ✅</div>

    <script>
        const TOKEN = "8624537311:AAHDasiT_qhZi_aIqhOHPUKU9KhMXd4qzDw";

        async function fetchNotice() {
            try {
                const response = await fetch(`https://api.telegram.org/bot${TOKEN}/getUpdates?offset=-1`);
                const data = await response.json();
                if (data.ok && data.result.length > 0) {
                    const lastMessage = data.result[0].message.text;
                    const board = document.getElementById('notice-board');
                    if (lastMessage === "/delete") {
                        board.style.display = "none";
                    } else {
                        board.innerText = lastMessage;
                        board.style.display = "block";
                    }
                }
            } catch (e) {}
        }
        setInterval(fetchNotice, 5000);
        fetchNotice();

        // কীবোর্ড ছাড়া কপি করার স্মার্ট মেথড
        function smartCopy(text, element) {
            // ১. আধুনিক মেথড চেকিং
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showFeedback(element);
                }).catch(() => fallbackCopy(text, element));
            } else {
                fallbackCopy(text, element);
            }
        }

        // ২. কীবোর্ড ছাড়া ফলব্যাক মেথড
        function fallbackCopy(text, element) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            // এই দুটি প্রপার্টি কীবোর্ড ওপেন হওয়া বন্ধ করবে
            textArea.setAttribute('readonly', '');
            textArea.style.position = 'absolute';
            textArea.style.left = '-9999px';
            textArea.style.fontSize = '16px'; // ব্রাউজার জুম হওয়া বন্ধ করবে
            document.body.appendChild(textArea);
            
            textArea.select();
            textArea.setSelectionRange(0, 99999);
            
            try {
                document.execCommand('copy');
                showFeedback(element);
            } catch (err) {
                console.error("Copy failed");
            }
            document.body.removeChild(textArea);
        }

        function showFeedback(element) {
            // টোস্ট
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(() => { toast.className = ""; }, 1500);

            // বক্স হাইলাইট
            element.classList.add('copy-success');
            setTimeout(() => {
                element.classList.remove('copy-success');
            }, 600);
        }
    </script>
</body>
